name: lto_exam_reviewer
description: >
  LTO Exam Reviewer Mobile App with Hiligaynon Translation - helps Ilonggo
  drivers prepare for the Philippine LTO driver's license exam in
  English, Filipino, or Hiligaynon.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.4.3+1

  # State management (lightweight, no code-gen required)
  provider: ^6.1.2

  # Secure JWT storage
  flutter_secure_storage: ^9.2.2

  # Google Sign-In, brokered through Supabase Auth
  google_sign_in: ^6.2.1
  supabase_flutter: ^2.6.0

  # Offline question-bank cache + local exam progress
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # Small, non-sensitive preferences (last-used language, etc.)
  shared_preferences: ^2.2.3

  # Detect offline mode before hitting the network
  connectivity_plus: ^6.0.3

  intl: ^0.19.0

  # Poppins font family
  google_fonts: ^6.2.1
  solar_icons: ^0.0.5

  # Lottie animations (e.g. the home readiness card badge)
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/landing/
    - assets/animations/

flutter_launcher_icons:
  android: true
  image_path: "assets/logo_icon_legacy.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo_icon_foreground.png"
  min_sdk_android: 21
